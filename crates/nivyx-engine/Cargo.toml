[package]
name = "nivyx-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Nivyx runtime: TUN forwarding, DoH, flow handling, strategy application."

[dependencies]
nivyx-core = { path = "../nivyx-core" }
ipstack = "=1.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
nivyx-core = { path = "../nivyx-core", features = ["testutil"] }
etherparse = "0.20"
socket2 = { version = "0.5", features = ["all"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
