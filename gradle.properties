org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=false
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Release version (single source of truth for versionName/versionCode and the Rust crates).
nivyx.version=0.9.0-rc1
# ABIs built into the APK. Add x86 here if you need very old emulators.
nivyx.abis=arm64-v8a,armeabi-v7a,x86_64
