name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 17 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
      - name: Verify tag matches version
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "^nivyx.version=$V$" gradle.properties || { echo "tag $V != gradle.properties"; exit 1; }
      - run: cargo test --workspace --locked
      - name: Stable tags must be signed
        env: { KS: "${{ secrets.NIVYX_KEYSTORE_B64 }}" }
        run: |
          case "$GITHUB_REF_NAME" in *-*) ;; *) [ -n "$KS" ] || { echo "stable release requires signing secrets"; exit 1; };; esac
      - name: Decode signing key (only if configured)
        env: { KS: "${{ secrets.NIVYX_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "NIVYX_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; fi
      - run: ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleRelease
        env:
          NIVYX_KEYSTORE_PASSWORD: ${{ secrets.NIVYX_KEYSTORE_PASSWORD }}
          NIVYX_KEY_ALIAS: ${{ secrets.NIVYX_KEY_ALIAS }}
      - name: Package
        run: |
          V="${GITHUB_REF_NAME#v}"; mkdir dist
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "dist/nivyx-android-v$V.apk"
          python3 scripts/make-sbom.py "$V" "dist/nivyx-android-v$V.spdx.json"
          (cd dist && sha256sum nivyx-android-v$V.apk nivyx-android-v$V.spdx.json > SHA256SUMS)
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with: { subject-path: "dist/*.apk" }
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; not overwriting its assets."
          else
            gh release create "$GITHUB_REF_NAME" dist/* $PRE --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
